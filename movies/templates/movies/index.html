{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>List Movies</h2>
        <hr>
        <form method="get" class="row g-2">
          <div class="col-auto">
            <div class="input-group">
              <label class="input-group-text" for="movie-search"></label>
              <input id="movie-search" type="text" class="form-control" name="search" value="{{ request.GET.search }}">
            </div>
          </div>
          <div class="col-auto">
            <button class="btn bg-blue text-white" type="submit">Search</button>
          </div>
        </form>
      </div>
    </div>

    <div class="row g-4">
      {% for movie in template_data.movies %}
      <div class="col-sm-6 col-lg-4 col-xl-3">
        <div class="card h-100 shadow-sm">
          <img src="{{ movie.image.url }}" class="card-img-top img-card-200" alt="{{ movie.name }} poster">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ movie.name }}</h5>
            <p class="card-text text-muted mb-3">${{ movie.price }}</p>
            <a href="{% url 'movies.show' id=movie.id %}" class="btn view-btn mt-auto">View Movie</a>
          </div>
        </div>
      </div>
      {% empty %}
      <div class="col-12">
        <p class="text-muted">No movies found.</p>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock content %}
